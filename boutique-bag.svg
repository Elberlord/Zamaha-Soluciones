<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b2a52"/>
      <stop offset="0.55" stop-color="#b14a7a"/>
      <stop offset="1" stop-color="#e5a2c1"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.35)"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="rgba(0,0,0,0.55)"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Decorative dots -->
  <g opacity="0.25">
    <circle cx="190" cy="170" r="6" fill="#f8fafc"/>
    <circle cx="1030" cy="160" r="5" fill="#f8fafc"/>
    <circle cx="1060" cy="660" r="7" fill="#f8fafc"/>
    <circle cx="220" cy="650" r="5" fill="#f8fafc"/>
  </g>

  <!-- Bag -->
  <g filter="url(#shadow)">
    <path d="M360 320
             C360 250 418 190 505 190
             H695
             C782 190 840 250 840 320"
          fill="none" stroke="url(#strap)" stroke-width="26" stroke-linecap="round"/>
    <rect x="320" y="300" width="560" height="360" rx="90" fill="url(#bag)"/>
    <path d="M360 350 H840" stroke="rgba(255,255,255,0.18)" stroke-width="10" stroke-linecap="round"/>
    <path d="M320 450
             C420 420 520 410 600 410
             C680 410 780 420 880 450"
          fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="500" cy="510" r="18" fill="rgba(255,255,255,0.42)"/>
    <circle cx="700" cy="510" r="18" fill="rgba(255,255,255,0.42)"/>
    <path d="M520 560
             C560 585 640 585 680 560"
          fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Caption (subtle) -->
  <g opacity="0.65">
    <text x="600" y="735" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="34" fill="#e5e7eb">
      Boutique
    </text>
  </g>
</svg>
